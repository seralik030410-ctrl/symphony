[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-2"
version = "0.7.0.dev0"
description = "Local-first chat runtime with observable isolated project execution"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "reportlab>=4.4,<5",
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0.2,<2",
  "pymupdf>=1.26,<2",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<1",
]

[tool.setuptools]
packages = [
  "backend",
  "backend.api",
  "backend.agent",
  "backend.artifacts",
  "backend.models",
  "backend.sandbox",
  "backend.skills",
  "backend.storage",
  "backend.tools",
  "backend.research",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
